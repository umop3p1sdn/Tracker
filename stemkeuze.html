<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HO-ME stemkeuze</title>
<!-- Keuzepagina (v66.x), los van HO-ME: de gratis Nederlandse en Vlaamse Piper-stemmen beluisteren (voorbeelden gemaakt door
     de Stem-fabriek, .github/workflows/stem.yml → stem/proef/). Sjoerd kiest er één; die wordt HO-ME's natuurlijke stem. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: #0b1626; color: #fff;
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 24px; margin: 4px 0 8px; }
  .noot { font-size: 15px; color: #b9c7da; margin: 6px 0 14px; }
  .kaart { background: #13233a; border-radius: 14px; padding: 14px; margin: 12px 0; }
  .kop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .kop b { font-size: 20px; }
  .kop span { font-size: 14px; color: #7fd8ef; }
  .zin { margin: 10px 0 0; font-size: 14px; color: #b9c7da; }
  audio { width: 100%; height: 40px; margin-top: 4px; }
  .lic { font-size: 12px; color: #8ea3bd; margin-top: 10px; overflow-wrap: anywhere; }
  #fout { color: #ff8a80; }
</style>
</head>
<body>
<h1>HO-ME stemkeuze</h1>
<p class="noot">Luister naar de stemmen en vertel Claude welke je wilt. Elke stem zegt dezelfde drie zinnen: navigatie, flitser en een bericht.</p>
<div id="lijst">Laden…</div>
<p id="fout"></p>
<script>
'use strict';
const LAND = { NL: 'Nederlands', BE: 'Vlaams' };
fetch('stem/proef/stemmen.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(d => {
  const lijst = document.getElementById('lijst');
  lijst.textContent = '';
  d.stemmen.forEach(s => {
    const k = document.createElement('div'); k.className = 'kaart';
    const kop = document.createElement('div'); kop.className = 'kop';
    const b = document.createElement('b'); b.textContent = s.key;
    const i = document.createElement('span');
    i.textContent = (LAND[s.land] || s.taal) + ' · ' + s.kwaliteit + ' · ' + s.mb + ' MB' + (s.sprekers > 1 ? ' · ' + s.sprekers + ' sprekers (de eerste)' : '');
    kop.append(b, i); k.append(kop);
    Object.keys(s.mp3).forEach(n => {
      const z = document.createElement('div'); z.className = 'zin'; z.textContent = d.zinnen[n] || n;
      const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = 'stem/proef/' + s.mp3[n];
      k.append(z, a);
    });
    if (s.licentie) { const l = document.createElement('div'); l.className = 'lic'; l.textContent = s.licentie; k.append(l); }
    lijst.append(k);
  });
}).catch(e => { document.getElementById('lijst').textContent = ''; document.getElementById('fout').textContent = 'De voorbeelden zijn er nog niet (' + e.message + ').'; });
</script>
</body>
</html>
