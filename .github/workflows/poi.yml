# POI-fabriek (HO-ME Live Tracker v63.93; v63.96: ±40 landen = heel Europa behalve RU, BY, UA, MD, GE, TR): 1x per maand
# de POI's uit de OpenStreetMap-extracten van Geofabrik halen en als kleine bestanden in de map POI/ zetten (zie POI/LEESMIJ.md).
# Met de hand starten kan ook: tab Actions -> POI-fabriek -> Run workflow.
name: POI-fabriek

on:
  schedule:
    - cron: '23 2 3 * *'        # de 3e van elke maand, 02:23 UTC (Geofabrik ververst dagelijks; 1x per maand is genoeg)
  workflow_dispatch:
    inputs:
      alleen_opruimen:
        description: 'Alleen opruimen: geen nieuwe lijsten maken, alleen de oude POI-versies uit de geschiedenis halen'
        type: boolean
        default: false

permissions:
  contents: write                # de nieuwe bestanden in POI/ opslaan (de site bouwt daarna vanzelf opnieuw)

concurrency:
  group: poi-fabriek
  cancel-in-progress: false

jobs:
  maak:
    runs-on: ubuntu-24.04
    timeout-minutes: 240         # v63.96: ±28 GB bij Geofabrik (één land tegelijk, het grote bestand gaat meteen weg)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0             # v63.96: de hele geschiedenis - opslaan.sh haalt daar de oude POI-versies uit

      - name: Gereedschap (osmium, shapely, git-filter-repo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-shapely
          sudo apt-get install -y -qq git-filter-repo || pip3 install --break-system-packages -q git-filter-repo || true

      # Gaat het mis, dan komen de laatste regels als foutmelding bovenaan de run (ook via de API te lezen)
      - name: POI maken (Geofabrik -> POI/*.tsv.gz + index.json)
        if: ${{ !inputs.alleen_opruimen }}
        run: |
          set -o pipefail
          # v63.96: ±40 landen - werkmap op de grote tijdelijke schijf (/mnt) als die er is; anders RUNNER_TEMP
          WERK=/mnt/poi-werk
          if ! { sudo mkdir -p "$WERK" && sudo chown "$(id -u):$(id -g)" "$WERK"; } 2>/dev/null; then WERK="$RUNNER_TEMP/poi"; fi
          df -h / /mnt 2>/dev/null || true
          if ! python3 POI/fabriek.py --werk "$WERK" 2>&1 | tee "$RUNNER_TEMP/fabriek.log"; then
            echo "::error title=POI-fabriek mislukt::$(tail -n 25 "$RUNNER_TEMP/fabriek.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi

      # v63.96 (Sjoerd: "Waarom niet vaker opruimen? Oude hebben geen waarde meer" + "vaker opruimen is wel prettig"): opslaan
      # én de oude POI-versies uit de geschiedenis halen - alleen als niemand tussendoor iets op main zette (force-with-lease),
      # anders gewoon opslaan en de volgende keer opruimen. Zie POI/opslaan.sh en POI/LEESMIJ.md.
      - name: Opslaan in de repo (en de oude POI-versies opruimen)
        id: opslaan
        env:
          OPRUIMEN: ${{ inputs.alleen_opruimen && '1' || '' }}
        run: bash POI/opslaan.sh
      # De site bouwt na het opslaan vanzelf opnieuw (v63.95: GEMETEN bij twee runs — de opslag startte al een Pages-build;
      # een extra bouw-opdracht hier startte er een tweede die de eerste afbrak. Die stap is daarom weg.)
