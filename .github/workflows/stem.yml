# Stem-fabriek (HO-ME v66.x): de gratis Nederlandse en Vlaamse Piper-stemmen ophalen (zie stem/fabriek.py en stem/README.md).
# Met de hand starten: tab Actions -> Stem-fabriek -> Run workflow.
#   - stem leeg  = proef: van elke stem dezelfde zinnen als mp3 in stem/proef/ (te beluisteren op stemkeuze.html);
#                  de modellen zelf gaan naar de zijbranch stem-modellen (niet naar de site)
#   - stem gevuld (bv. nl_BE-nathalie-medium) = die ene stem in stem/piper/ zetten — die downloadt HO-ME
name: Stem-fabriek

on:
  workflow_dispatch:
    inputs:
      stem:
        description: 'Leeg = proef (alle stemmen beluisteren). Of de gekozen stem, bv. nl_BE-nathalie-medium'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: stem-fabriek
  cancel-in-progress: false

jobs:
  maak:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gereedschap (piper-tts, ffmpeg)
        run: |
          pip install -q piper-tts==1.3.0
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Proef — alle Nederlandse en Vlaamse stemmen
        if: ${{ inputs.stem == '' }}
        run: |
          set -o pipefail
          python3 stem/fabriek.py proef --uit stem/proef --modellen "$RUNNER_TEMP/modellen" 2>&1 | tee "$RUNNER_TEMP/fabriek.log"

      - name: Modellen naar de zijbranch stem-modellen (alleen voor het ontwikkelen, niet op de site)
        if: ${{ inputs.stem == '' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/modellen"
          rm -f *.wav
          git init -q -b stem-modellen
          git config user.name "stem-fabriek"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Piper-stemmen (nl) voor het ontwikkelen — $(date -u +%F)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stem-modellen

      - name: Gekozen stem in stem/piper/
        if: ${{ inputs.stem != '' }}
        run: python3 stem/fabriek.py kies "${{ inputs.stem }}"

      - name: Opslaan (main)
        run: |
          git config user.name "stem-fabriek"; git config user.email "actions@users.noreply.github.com"
          git add stem
          if git diff --cached --quiet; then echo "niets nieuw"; exit 0; fi
          git commit -q -m "Stem-fabriek: ${{ inputs.stem == '' && 'proef (voorbeelden)' || inputs.stem }}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
